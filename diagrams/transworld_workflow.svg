<svg width="100%" viewBox="0 0 680 880" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans KR', sans-serif">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
.t{fill:#3d3d3a;font-size:14px}
.ts{fill:#73726c;font-size:12px}
.th{fill:#3d3d3a;font-size:14px;font-weight:500}
.title{fill:#1a2540;font-size:16px;font-weight:700}
.subtitle{fill:#6b7280;font-size:12px}
.arr{stroke:#73726c;stroke-width:1.5;fill:none}
</style>
</defs>

<text class="title" x="40" y="40">운임등록 Workflow 자동화 아키텍처</text>
<text class="subtitle" x="40" y="58">HS효성 트랜스월드 · AI/OCR + Power Platform</text>

<text class="ts" x="40" y="92">Phase 1 · 메일 수신</text>
<rect x="40" y="100" width="170" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="125" y="123" text-anchor="middle" fill="#3C3489">선사</text>
<text class="ts" x="125" y="141" text-anchor="middle" fill="#534AB7">Carrier</text>
<rect x="255" y="100" width="170" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="340" y="123" text-anchor="middle" fill="#3C3489">현업 담당자</text>
<text class="ts" x="340" y="141" text-anchor="middle" fill="#534AB7">Business user</text>
<rect x="470" y="100" width="170" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="555" y="123" text-anchor="middle" fill="#2C2C2A">시스템 메일함</text>
<text class="ts" x="555" y="141" text-anchor="middle" fill="#5F5E5A">Outlook</text>
<line x1="210" y1="128" x2="255" y2="128" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="232" y="120" text-anchor="middle">① 운임 메일</text>
<line x1="425" y1="128" x2="470" y2="128" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="447" y="120" text-anchor="middle">② 포워드</text>

<text class="ts" x="40" y="190">Phase 2 · 자동 처리 (분기)</text>
<rect x="40" y="200" width="600" height="56" rx="8" fill="#FBEAF0" stroke="#D4537E" stroke-width="0.5"/>
<text class="th" x="56" y="224" fill="#72243E">Power Automate (Orchestrator)</text>
<text class="ts" x="56" y="242" fill="#993556">메일 수신 트리거 → 파트너사 여부 판단 → 분기 처리</text>
<line x1="555" y1="156" x2="340" y2="200" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="460" y="180" text-anchor="middle">③ 트리거</text>

<rect x="40" y="290" width="290" height="80" rx="8" fill="#FBEAF0" stroke="#D4537E" stroke-width="0.5"/>
<text class="th" x="56" y="314" fill="#72243E">Power Automate Desktop</text>
<text class="ts" x="56" y="332" fill="#993556">④a 파트너사 · 정형 Excel</text>
<text class="ts" x="56" y="350" fill="#993556">VBScript Excel 가공 자동화</text>
<rect x="350" y="290" width="290" height="80" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text class="th" x="366" y="314" fill="#633806">AI &amp; OCR</text>
<text class="ts" x="366" y="332" fill="#854F0B">④b 비파트너 · 비정형 문서</text>
<text class="ts" x="366" y="350" fill="#854F0B">Document Understanding · Prompt</text>
<line x1="200" y1="256" x2="185" y2="290" class="arr" marker-end="url(#arrow)"/>
<line x1="480" y1="256" x2="495" y2="290" class="arr" marker-end="url(#arrow)"/>

<text class="ts" x="40" y="404">Phase 3 · 저장 및 알림</text>
<rect x="40" y="414" width="600" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text class="th" x="56" y="438" fill="#085041">SharePoint List</text>
<text class="ts" x="56" y="456" fill="#0F6E56">추출된 운임 데이터 저장 · 15 tables (job, task, freight_rate 등)</text>
<line x1="185" y1="370" x2="280" y2="414" class="arr" marker-end="url(#arrow)"/>
<line x1="495" y1="370" x2="400" y2="414" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="340" y="395" text-anchor="middle">⑤ 데이터 저장</text>

<path d="M40 442 Q20 442 20 300 Q20 128 255 128" stroke="#888780" stroke-width="1.2" stroke-dasharray="3 3" fill="none" marker-end="url(#arrow)"/>
<text class="ts" x="28" y="285" text-anchor="start" transform="rotate(-90 28 285)">⑥ 추출완료 알림</text>

<text class="ts" x="40" y="504">Phase 4 · 데이터 검토</text>
<rect x="40" y="514" width="600" height="80" rx="8" fill="#FBEAF0" stroke="#D4537E" stroke-width="0.5"/>
<text class="th" x="56" y="538" fill="#72243E">Power Apps (CRUD)</text>
<text class="ts" x="56" y="556" fill="#993556">⑦ 현업이 운임 데이터 조회·수정·삭제 (반응형 화면)</text>
<text class="ts" x="56" y="574" fill="#993556">⑧ 데이터 확인 후 [HLMS 등록] 버튼 클릭</text>
<line x1="340" y1="470" x2="340" y2="514" class="arr" marker-end="url(#arrow)"/>

<text class="ts" x="40" y="628">Phase 5 · HLMS 자동 등록</text>
<rect x="40" y="638" width="290" height="80" rx="8" fill="#FBEAF0" stroke="#D4537E" stroke-width="0.5"/>
<text class="th" x="56" y="662" fill="#72243E">Power Automate Desktop</text>
<text class="ts" x="56" y="680" fill="#993556">⑨ HLMS 등록 자동화</text>
<text class="ts" x="56" y="698" fill="#993556">UI 자동화로 운임 데이터 입력</text>
<rect x="350" y="638" width="290" height="80" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text class="th" x="366" y="662" fill="#0C447C">HLMS 사이트</text>
<text class="ts" x="366" y="680" fill="#185FA5">⑩ 운임 정보 등록 완료</text>
<text class="ts" x="366" y="698" fill="#185FA5">External system</text>
<line x1="190" y1="594" x2="185" y2="638" class="arr" marker-end="url(#arrow)"/>
<line x1="330" y1="678" x2="350" y2="678" class="arr" marker-end="url(#arrow)"/>

<path d="M640 666 Q660 666 660 300 Q660 128 425 128" stroke="#888780" stroke-width="1.2" stroke-dasharray="3 3" fill="none" marker-end="url(#arrow)"/>
<text class="ts" x="668" y="400" text-anchor="start" transform="rotate(-90 668 400)">⑪ 등록 결과 알림</text>

<rect x="40" y="760" width="600" height="80" rx="8" fill="rgba(120,120,120,0.08)" stroke="none"/>
<text class="th" x="56" y="784" fill="#1a2540">핵심 포인트</text>
<text class="ts" x="56" y="802" fill="#3d3d3a">· AI/OCR + Power Automate Desktop 듀얼 파이프라인 (파트너 정형 데이터 vs 비파트너 비정형 문서)</text>
<text class="ts" x="56" y="820" fill="#3d3d3a">· 메일 트리거 → 자동 추출 → SharePoint 저장 → Power Apps 검토 → HLMS 자동 등록 (End-to-End)</text>
</svg>
