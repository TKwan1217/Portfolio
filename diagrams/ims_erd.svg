<svg width="100%" viewBox="0 0 680 540" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style type="text/css">
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/variable/pretendardvariable-dynamic-subset.css');
text { font-family: 'Pretendard Variable', 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
.t{fill:#3d3d3a;font-size:14px}
.ts{fill:#73726c;font-size:12px}
.th{fill:#3d3d3a;font-size:13px;font-weight:600}
.title{fill:#1a2540;font-size:16px;font-weight:700;letter-spacing:-0.01em}
.subtitle{fill:#6b7280;font-size:12px}
.arr{stroke:#a8a8a2;stroke-width:1.5;fill:none}
</style>
</defs>

<text class="title" x="40" y="40">사고 관리 시스템(IMS) · 데이터 모델</text>
<text class="subtitle" x="40" y="58">INCIDENT 중심 구조 · 쿠팡</text>

<!-- ROOT: INCIDENT -->
<rect x="270" y="84" width="140" height="48" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text class="th" x="340" y="104" text-anchor="middle" fill="#085041">INCIDENT</text>
<text class="ts" x="340" y="120" text-anchor="middle" fill="#0F6E56">사고 마스터</text>

<!-- connectors: root -> 6 children -->
<line x1="340" y1="132" x2="340" y2="155" class="arr"/>
<line x1="85" y1="155" x2="595" y2="155" class="arr"/>
<line x1="85" y1="155" x2="85" y2="180" class="arr" marker-end="url(#arrow2)"/>
<line x1="187" y1="155" x2="187" y2="180" class="arr" marker-end="url(#arrow2)"/>
<line x1="289" y1="155" x2="289" y2="180" class="arr" marker-end="url(#arrow2)"/>
<line x1="391" y1="155" x2="391" y2="180" class="arr" marker-end="url(#arrow2)"/>
<line x1="493" y1="155" x2="493" y2="180" class="arr" marker-end="url(#arrow2)"/>
<line x1="595" y1="155" x2="595" y2="180" class="arr" marker-end="url(#arrow2)"/>

<!-- INCIDENT_PERSON (highlighted, has children) -->
<rect x="40" y="180" width="90" height="56" rx="7" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text class="th" x="85" y="203" text-anchor="middle" fill="#3C3489" font-size="12">INCIDENT_</text>
<text class="th" x="85" y="216" text-anchor="middle" fill="#3C3489" font-size="12">PERSON</text>
<text class="ts" x="85" y="230" text-anchor="middle" fill="#534AB7" font-size="10.5">관련자</text>

<!-- 5 accident-type entities -->
<rect x="142" y="180" width="90" height="56" rx="7" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text class="th" x="187" y="207" text-anchor="middle" fill="#712B13" font-size="12">FIRE</text>
<text class="ts" x="187" y="223" text-anchor="middle" fill="#993C1D" font-size="10.5">화재</text>

<rect x="244" y="180" width="90" height="56" rx="7" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text class="th" x="289" y="203" text-anchor="middle" fill="#712B13" font-size="11.5">NEARMISS</text>
<text class="ts" x="289" y="223" text-anchor="middle" fill="#993C1D" font-size="10.5">아차사고</text>

<rect x="346" y="180" width="90" height="56" rx="7" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text class="th" x="391" y="199" text-anchor="middle" fill="#712B13" font-size="10.5">TRAFFIC-</text>
<text class="th" x="391" y="212" text-anchor="middle" fill="#712B13" font-size="10.5">ACCIDENT</text>
<text class="ts" x="391" y="227" text-anchor="middle" fill="#993C1D" font-size="10.5">교통사고</text>

<rect x="448" y="180" width="90" height="56" rx="7" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text class="th" x="493" y="203" text-anchor="middle" fill="#712B13" font-size="12">PROPERTY</text>
<text class="ts" x="493" y="223" text-anchor="middle" fill="#993C1D" font-size="10.5">재산사고</text>

<rect x="550" y="180" width="90" height="56" rx="7" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text class="th" x="595" y="203" text-anchor="middle" fill="#712B13" font-size="11">ENVIRONMENT</text>
<text class="ts" x="595" y="223" text-anchor="middle" fill="#993C1D" font-size="10.5">환경사고</text>

<!-- connectors: INCIDENT_PERSON -> INJURY / EVACUATION -->
<line x1="85" y1="236" x2="85" y2="255" class="arr"/>
<line x1="65" y1="255" x2="215" y2="255" class="arr"/>
<line x1="65" y1="255" x2="65" y2="280" class="arr" marker-end="url(#arrow2)"/>
<line x1="215" y1="255" x2="215" y2="280" class="arr" marker-end="url(#arrow2)"/>

<rect x="10" y="280" width="110" height="44" rx="7" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text class="th" x="65" y="300" text-anchor="middle" fill="#3C3489" font-size="11.5">INJURY</text>
<text class="ts" x="65" y="315" text-anchor="middle" fill="#534AB7" font-size="10">부상 · 질병</text>

<rect x="160" y="280" width="110" height="44" rx="7" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text class="th" x="215" y="300" text-anchor="middle" fill="#3C3489" font-size="11.5">EVACUATION</text>
<text class="ts" x="215" y="315" text-anchor="middle" fill="#534AB7" font-size="10">119 후송</text>

<!-- notes -->
<rect x="40" y="365" width="600" height="140" rx="8" fill="rgba(120,120,120,0.08)" stroke="none"/>
<text class="th" x="56" y="390" fill="#1a2540">주요 관계 · 확장 구조</text>
<text class="ts" x="56" y="412" fill="#3d3d3a">· INCIDENT는 사고 유형 5종(화재·아차·교통·재산·환경) 각각과 1:1 상세 테이블로 연결</text>
<text class="ts" x="56" y="431" fill="#3d3d3a">· INCIDENT_PERSON(관련자)은 부상질병(INJURY), 119 후송(EVACUATION) 정보를 하위에 보유</text>
<text class="ts" x="56" y="450" fill="#3d3d3a">· 사고 유형 공통 입력 필드는 테이블 스키마로 관리, 법인별 추가 필드는 JSON 스키마로 정의</text>
<text class="ts" x="56" y="469" fill="#3d3d3a">  하여 런타임에 파싱 · 동적 커스텀 컨트롤로 렌더링 (신규 법인 온보딩 시 테이블 구조 변경 불필요)</text>
<text class="ts" x="56" y="488" fill="#3d3d3a">· 반응형 레이아웃 + 다국어(번역) 지원으로 다중 법인 동시 배포 대응</text>
</svg>
